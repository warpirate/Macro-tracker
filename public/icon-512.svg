<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MacroFit">
  <defs>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12A175"/>
      <stop offset="55%" stop-color="#0C8261"/>
      <stop offset="100%" stop-color="#0B674E"/>
    </linearGradient>
  </defs>

  <!-- Full bleed: this icon is declared purpose "any maskable", so launchers may crop
       to a circle. All artwork stays inside the central 80% safe zone. -->
  <rect width="512" height="512" fill="url(#jade)"/>

  <!-- Three macro rings, starting at 12 o'clock. pathLength normalises each circle so
       the dash values read directly as "portion filled". -->
  <g transform="rotate(-90 256 256)" fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="150" stroke="#FAFAF9" stroke-opacity="0.2" stroke-width="30"/>
    <circle cx="256" cy="256" r="150" stroke="#FAFAF9" stroke-width="30"
            pathLength="100" stroke-dasharray="78 22"/>

    <circle cx="256" cy="256" r="106" stroke="#FAFAF9" stroke-opacity="0.2" stroke-width="26"/>
    <circle cx="256" cy="256" r="106" stroke="#EDFAF5" stroke-width="26"
            pathLength="100" stroke-dasharray="55 45"/>

    <circle cx="256" cy="256" r="64" stroke="#FAFAF9" stroke-opacity="0.2" stroke-width="22"/>
    <circle cx="256" cy="256" r="64" stroke="#A8E7CE" stroke-width="22"
            pathLength="100" stroke-dasharray="35 65"/>
  </g>
</svg>
